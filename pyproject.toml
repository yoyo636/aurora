[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-lang"
version = "2.0.0"
description = "Aurora 编程语言 — 融合 Rust/Python/Go/TypeScript 优势的通用编程语言"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["language", "interpreter", "programming-language"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools]
packages = ["aurora"]
